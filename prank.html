<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memeriksa...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .kotak {
            background: white;
            padding: 50px 30px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0,0,0,0.15);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        .loading {
            width: 80px;
            height: 80px;
            border: 5px solid #ddd;
            border-top-color: #000;
            border-radius: 50%;
            animation: putar 1s linear infinite;
            margin: 0 auto 30px;
        }

        @keyframes putar {
            to { transform: rotate(360deg); }
        }

        h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .pesan {
            color: #666;
            font-size: 15px;
            margin-bottom: 10px;
        }

        /* Pesan Prank (sembunyi dulu) */
        .prank {
            display: none;
        }

        .prank h1 {
            font-size: 35px;
            color: red;
            margin-bottom: 20px;
        }

        .prank p {
            font-size: 18px;
            color: #333;
            line-height: 1.6;
        }

        .emoji {
            font-size: 60px;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="kotak">
        <!-- Bagian yang tampil DULU -->
        <div id="proses">
            <div class="loading"></div>
            <h2>Sedang memverifikasi akun...</h2>
            <p class="pesan">Sedang memeriksa data & keamanan...</p>
        </div>

        <!-- Bagian PRANK (muncul nanti) -->
        <div class="prank" id="hasil">
            <div class="emoji">😆</div>
            <h1>DAPAT KAMU!</h1>
            <p><b>HEI HEI HEI!</b><br>
            Tenang saja, akunmu AMAN kok! 😄<br><br>
            Ini cuma lelucon dari<br>
            <b>ikromwalidaini</b> 😎<br><br>
            Jangan kaget ya! Hahaha 🤣</p>
        </div>
    </div>

    <script>
        // Setelah 4 detik, hilangkan proses & munculkan prank
        setTimeout(function() {
            document.getElementById('proses').style.display = 'none';
            document.getElementById('hasil').style.display = 'block';
        }, 4000);
    </script>

</body>
  </html>
