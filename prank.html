<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memeriksa...</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif;}
        body {background-color: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;}
        .kotak {background: white; padding: 50px 30px; border-radius: 20px; box-shadow: 0 0 30px rgba(0,0,0,0.15); text-align: center; width: 90%; max-width: 420px;}
        .loading {width: 80px; height: 80px; border: 5px solid #ddd; border-top-color: #000; border-radius: 50%; animation: putar 1s linear infinite; margin: 0 auto 20px;}
        @keyframes putar {to {transform: rotate(360deg);}}
        .hitung {font-size: 40px; font-weight: bold; color: #000; margin: 15px 0;}
        h2 {color: #333; margin-bottom: 10px; font-size: 20px;}
        .pesan {color: #666; font-size: 15px;}
        .prank {display: none;}
        .emoji-atas {font-size: 70px; margin-bottom: 10px; animation: goyang 0.5s ease-in-out infinite alternate;}
        @keyframes goyang {from {transform: rotate(-10deg);} to {transform: rotate(10deg);}}
        .prank h1 {font-size: 42px; color: red; margin-bottom: 25px;}
        .teks-prank {font-size: 18px; color: #333; line-height: 1.8; opacity: 0; transform: translateY(20px); transition: all 0.8s ease-out;}
        .teks-prank.muncul {opacity: 1; transform: translateY(0);}
        .tombol-balik {margin-top: 30px; padding: 12px 30px; background-color: #000; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;}
        .tombol-balik:hover {background-color: #333;}
    </style>
</head>
<body>
    <div class="kotak">
        <div id="proses">
            <div class="loading"></div>
            <h2>Sedang memverifikasi akun...</h2>
            <div class="hitung" id="angka">3</div>
            <p class="pesan">Mohon tunggu sebentar...</p>
        </div>
        <div class="prank" id="hasil">
            <div class="emoji-atas">😆</div>
            <h1>DAPAT KAMU!</h1>
            <div class="teks-prank" id="tulisan">
                HEI HEI HEI!<br>
                Tenang saja, akunmu AMAN kok! 😆<br><br>
                Ini cuma lelucon dari<br>
                <b>ikromwalidaini 😎</b><br><br>
                Jangan kaget ya! Hahaha 🤣
            </div>
            <br>
            <button class="tombol-balik" onclick="window.location.href='login.html'">🔙 Balik ke Halaman Awal</button>
        </div>
    </div>
    <script>
        let hitung = 3;
        let tampilAngka = document.getElementById('angka');
        let waktu = setInterval(function() {
            hitung--;
            tampilAngka.textContent = hitung;
            if(hitung <= 0) {clearInterval(waktu); munculkanPrank();}
        }, 1000);
        function munculkanPrank() {
            document.getElementById('proses').style.display = 'none';
            document.getElementById('hasil').style.display = 'block';
            setTimeout(function() {document.getElementById('tulisan').classList.add('muncul');}, 300);
        }
    </script>
</body>
</html>
