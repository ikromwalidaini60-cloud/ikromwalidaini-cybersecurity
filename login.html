<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ikromwalidaini - Situs Resmi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .kotak-besar {
            display: flex;
            width: 800px;
            max-width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Bagian Kiri + Foto */
        .bagian-selamat {
            width: 50%;
            background: linear-gradient(135deg, #000000, #222222);
            color: white;
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .foto-profil {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        .bagian-selamat h1 {
            font-size: 26px;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .bagian-selamat p {
            font-size: 15px;
            line-height: 1.6;
            opacity: 0.85;
            margin-bottom: 20px;
        }

        .nama-situs {
            padding: 12px 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            color: #fff;
            line-height: 1.5;
            word-break: break-word;
        }

        /* Bagian Kanan - Form */
        .bagian-form {
            width: 50%;
            background-color: white;
            padding: 40px 25px;
        }

        .bagian-form h2 {
            font-size: 22px;
            margin-bottom: 25px;
            color: #222;
        }

        .bagian-form input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }

        .tombol-daftar {
            width: 100%;
            padding: 13px;
            background-color: #000;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 0 20px;
        }

        .tombol-daftar:hover {
            background-color: #333;
        }

        .teks-masuk {
            font-size: 14px;
            color: #555;
        }

        .teks-masuk a {
            color: #000;
            font-weight: bold;
            text-decoration: none;
        }

        /* 📱 Rapi di HP */
        @media (max-width: 650px) {
            .kotak-besar {
                flex-direction: column;
            }
            .bagian-selamat, .bagian-form {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="kotak-besar">
        <!-- Bagian Kiri + FOTO PROFIL -->
        <div class="bagian-selamat">
        
            <img src="profil.png" alt="Foto Ikrom Walidaini" class="foto-profil">

            <h1>Selamat Datang!</h1>
            <p>Silakan isi data diri untuk membuat akun baru dan bergabung bersama kami.</p>
            
            <div class="nama-situs">
                situs website resmi<br>
                ikromwalidaini
            </div>
        </div>

        <!-- Bagian Kanan - Form -->
        <div class="bagian-form">
            <h2>Daftar Akun</h2>
            <form>
                <input type="text" placeholder="Nama Pengguna" required>
                <input type="email" placeholder="Alamat Email" required>
                <input type="password" placeholder="Kata Sandi" required>
                <button class="tombol-daftar">Daftar Sekarang</button>
                <p class="teks-masuk">Sudah punya akun? <a href="#">Masuk di sini</a></p>
            </form>
        </div>
    </div>

</body>
</html>
